<meta charset="UTF-8">

<title>Contact — Letter Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2A41; --bg-panel:#24384F; --rung:#F5EFE0; --ink:#F5EFE0; --ink-dim:#9FB3C8; --amber:#E8A33D;
  }
  body{
    margin:0; padding: 32px 16px 80px;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink); font-family:'Inter',system-ui,sans-serif;
  }
  .wrap{ max-width: 560px; margin:0 auto; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:2rem; margin-bottom:4px; }
  a{ color: var(--amber); }
  .back{ display:inline-block; margin-bottom: 22px; color: var(--ink-dim); text-decoration:none; }
  .back:hover{ color: var(--amber); }
  .intro{ color: var(--ink-dim); margin-bottom: 24px; font-size: 0.92rem; }

  .contact-card{ background: var(--bg-panel); border-radius:18px; padding: 24px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }

  label{ display:block; font-size:0.8rem; color: var(--ink-dim); margin-bottom: 6px; text-transform:uppercase; letter-spacing:0.06em; }
  input[type="text"], input[type="email"], textarea{
    width:100%; box-sizing:border-box; background: rgba(245,239,224,0.06); border: 1.5px solid rgba(245,239,224,0.15);
    border-radius: 10px; padding: 12px 14px; color: var(--ink); font-family:'Inter',sans-serif; font-size: 0.95rem;
    margin-bottom: 18px;
  }
  input[type="text"]:focus, input[type="email"]:focus, textarea:focus{ outline:none; border-color: var(--amber); }
  textarea{ min-height: 130px; resize: vertical; }
  ::placeholder{ color: var(--ink-dim); opacity: 0.6; }

  .submit-btn{
    width:100%; background: var(--amber); color:#1B2A41; border:none; border-radius:10px;
    padding: 13px 18px; font-family:'Inter',sans-serif; font-weight:700; font-size: 0.95rem; cursor:pointer;
  }
  .submit-btn:hover{ filter: brightness(1.05); }
  .submit-btn:active{ transform: scale(0.98); }

  .note{ font-size: 0.78rem; color: var(--ink-dim); margin-top: 14px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back to game</a>
  <h1>Contact</h1>
  <div class="intro">Having fun? Have feedback? Send a message below.</div>

  <div class="contact-card">
    <form action="https://formsubmit.co/jmaser4@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Letter Ladder — Contact form message">
      <input type="hidden" name="_template" value="box">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://jmaser54.github.io/letter-ladder/contact-sent.html">

      <label for="name">Your name (optional)</label>
      <input type="text" id="name" name="name" placeholder="Jane Doe">

      <label for="email">Your email (optional)</label>
      <input type="email" id="email" name="email" placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Type your message here…" required></textarea>

      <button type="submit" class="submit-btn">Send message</button>
    </form>
  </div>
</div>
</body>
</html>
