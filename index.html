<title>Letter Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2A41;
    --bg-panel: #24384F;
    --rung: #F5EFE0;
    --rung-empty: rgba(245,239,224,0.08);
    --ink: #F5EFE0;
    --ink-dim: #9FB3C8;
    --amber: #E8A33D;
    --red: #D9705F;
    --blue: #5B9BD5;
    --green: #6FBF8B;
  }
  *{box-sizing:border-box;}
  html, body{ height: 100%; }
  body{
    margin:0;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap{
    max-width: 560px; margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 12px;
  }

  header{ position: relative; text-align:center; margin-bottom: 12px; flex-shrink:0; }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 2rem;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .brand .rung-i{ color: var(--amber); }
  .top-links{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 16px; margin-top:6px; font-size: 0.8rem;
  }
  .top-links a{ color: var(--ink-dim); text-decoration:none; border-bottom: 1px dotted var(--ink-dim); }
  .top-links a:hover{ color: var(--amber); border-color: var(--amber); }
  .top-links .logo-link{ display:inline-flex; align-items:center; border-bottom:none; line-height:0; }
  .top-links .logo-link svg{ display:block; border-radius:50%; transition:opacity 0.15s ease; }
  .top-links .logo-link:hover svg{ opacity:0.8; }

  .date-row{
    text-align:center; color: var(--ink-dim); font-size: 0.8rem; margin-bottom: 10px;
    letter-spacing: 0.03em; text-transform: uppercase; flex-shrink:0;
  }

  .tabs{
    display:flex; background: rgba(0,0,0,0.2); border-radius: 999px; padding: 4px; margin-bottom: 14px;
    flex-shrink:0;
  }
  .tab{
    flex:1; text-align:center; padding: 9px 0; border-radius: 999px; cursor:pointer;
    font-weight:600; font-size:0.9rem; color: var(--ink-dim); transition: all 0.15s ease;
    user-select:none;
  }
  .tab.active{ background: var(--amber); color: #1B2A41; }
  .tab .dot{ display:none; }

  .panel{
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 18px 18px 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
  }


  .ladder-scroll{
    /* No longer its own internal scroll region - the whole page scrolls
       naturally now via the browser's own scrollbar, which handles the
       on-screen keyboard correctly without any custom viewport math. */
    padding: 2px 2px;
  }
  .ladder{
    display:flex; flex-direction:column; align-items:center; gap: var(--rung-gap, 10px);
    position: relative;
    padding: 10px 30px;
    margin: 0 auto;
    width: -webkit-fit-content;
    width: fit-content;
  }

  @keyframes fade-away{
    0%{ opacity:1; }
    100%{ opacity:0; }
  }
  .ladder.fading-out{
    animation: fade-away 0.92s ease-in forwards;
  }

  .rung-row{
    display:grid; grid-template-columns: 22px 1fr 22px; align-items:center; column-gap:12px; width:100%;
    position: relative;
  }
  .rung-row > .rung{ justify-self: center; }
  .rung-count{ width: 22px; text-align:right; color: var(--ink-dim); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .delete-guess-btn{
    width: 24px; height: 38px;
    border: none; background: none;
    color: #FF5A45;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items:center; justify-content:center;
    padding: 0;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  .delete-guess-btn:hover{ filter: brightness(1.15); }
  .delete-guess-btn:active{ transform: scale(0.85); }
  .rung{
    font-family:'Fraunces', serif;
    font-size: var(--rung-font, 1.35rem);
    font-weight:600;
    letter-spacing: 0.05em;
    background: var(--rung);
    color: #1B2A41;
    height: var(--rung-height, 50px);
    line-height: var(--rung-height, 50px);
    padding: 0 18px;
    border-radius: 10px;
    text-align:center;
    text-transform: uppercase;
    box-sizing: border-box;
  }
  .rung.empty{
    background: var(--rung-empty);
    color: var(--ink-dim);
    border: 1.5px dashed rgba(245,239,224,0.25);
  }
  .rung.anchor{ background: var(--amber); }
  .rung.clickable{ cursor: pointer; transition: filter 0.1s ease, transform 0.1s ease; }
  .rung.clickable:hover{ filter: brightness(1.08); }
  .rung.clickable:active{ transform: scale(0.97); }
  input.rung-input{
    border: none;
    outline: none;
    box-shadow: 0 0 0 2px var(--amber);
    box-sizing: border-box;
    min-width: 0;
    transform: scaleX(1.06);
  }

  /* Ladders get taller the more rungs a puzzle has, so these tiers shrink
     things down automatically to keep long puzzles more compact - short
     puzzles stay at full comfortable size. Combined with the scrollable
     ladder area above, a puzzle that still doesn't fully fit (rare - only
     the longest puzzles on the smallest screens) simply scrolls within its
     own little area instead of taking over the whole page. */
  .panel.rungs-md{ --rung-font: 1.15rem; --rung-height: 44px; --rung-minw: 115px; --rung-gap: 6px; }
  .panel.rungs-lg{ --rung-font: 1rem; --rung-height: 39px; --rung-minw: 100px; --rung-gap: 5px; }
  .panel.rungs-xl{ --rung-font: 0.9rem; --rung-height: 35px; --rung-minw: 88px; --rung-gap: 4px; }


  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.95rem;
    border:none; border-radius:10px; cursor:pointer; padding: 12px 18px;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--amber); color:#1B2A41; }
  .btn-ghost{ background: rgba(245,239,224,0.08); color: var(--ink); }
  #hint-btn{ display:inline-flex; align-items:center; justify-content:center; padding: 10px 14px; }

  .feedback{ margin-top:12px; text-align:center; font-weight:600; min-height: 24px; flex-shrink:0; }
  .feedback.win, .feedback.ok{ text-align:center; }
  .error-list{ list-style:none; margin: 12px 0 0; padding:0; text-align:left; display:inline-block; }
  .error-list li{ position:relative; padding-left:18px; margin-bottom:6px; font-weight:600; color: var(--red); font-size:0.9rem; }
  .error-list li::before{ content:"●"; color: var(--red); position:absolute; left:0; font-size:0.6rem; top:5px; }
  .error-list-wrap{ display:flex; justify-content:center; }
  .feedback.win{ color: var(--amber); font-weight: 700; }
  .feedback.error{ color: var(--red); }
  .feedback.ok{ color: var(--ink-dim); font-weight:500; }
  .details{ margin-top:4px; text-align:center; font-size:0.8rem; color: var(--red); font-style:italic; }

  .letter-bank{
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .bank-tiles{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 100%;
  }
  .bank-tile{
    width: 48px; height: 48px;
    border: none; border-radius: 10px;
    background: var(--rung);
    color: #1B2A41;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.3rem;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .bank-tile.from-below{ background: var(--amber); }
  .bank-tile:active{ transform: scale(0.9); }
  .bank-tile{ touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; } /* prevents the browser's own touch-scroll AND text-selection highlight from fighting the hold-and-drag gesture */
  .bank-tile.dragging{
    position: relative;
    z-index: 50;
    box-shadow: 0 8px 18px rgba(0,0,0,0.45);
    transition: none;
    animation: tile-jiggle 0.15s ease-in-out infinite;
  }
  @keyframes tile-jiggle{
    0%, 100%{ rotate: -5deg; }
    50%{ rotate: 5deg; }
  }
  .bank-tile.used{
    background: rgba(245,239,224,0.08);
    color: var(--ink-dim);
    opacity: 0.4;
    cursor: default;
  }
  .bank-controls{
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    margin-top: 22px;
  }
  .bank-ctrl-btn{
    width: 46px; height: 46px;
    border: none; border-radius: 10px;
    background: rgba(245,239,224,0.08);
    color: var(--ink);
    font-size: 1.5rem;
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .bank-ctrl-btn:active{ transform: scale(0.92); }
  .bank-ctrl-btn.kb-on{ background: var(--bg); color: var(--ink); }
  .bank-ctrl-btn.bank-submit-btn{ background: var(--amber); color: #1B2A41; }
  .bank-ctrl-btn.bank-group-spacer{ margin-left: 14px; }

  .bank-primary-actions{
    display: flex; gap: 14px;
    max-width: 100%;
    margin-top: 18px;
    margin-bottom: 18px;
  }
  .bank-primary-btn{
    flex: 1;
    height: 39px;
    border: none; border-radius: 12px;
    background: rgba(245,239,224,0.08);
    color: var(--ink);
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .bank-primary-btn:active{ transform: scale(0.96); }
  .bank-primary-btn.bank-submit-btn{ background: var(--amber); color: #1B2A41; }

  .actions-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; margin-top:10px; flex-shrink:0; }
  .hint-display{
    text-align:center; margin-top:10px; margin-bottom:18px; font-size:0.85rem; color: var(--ink-dim);
    font-style:italic; flex-shrink:0; min-height: 0;
  }
  .hint-display .hint-letters{ color: var(--amber); font-style:normal; font-weight:600; letter-spacing:0.04em; }
  .share-status{ text-align:center; margin-top:8px; font-size:0.8rem; color: var(--blue); font-weight:600; flex-shrink:0; }

  .empty-state{ text-align:center; color: var(--ink-dim); padding: 30px 0; }

  .confirm-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.6);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .confirm-card{
    background: var(--bg-panel); border-radius: 16px; padding: 24px 22px;
    max-width: 340px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .confirm-message{ font-size: 1rem; margin-bottom: 20px; text-align:center; }
  .confirm-actions{ display:flex; gap:10px; justify-content:center; }
  .confirm-actions button{ flex:1; }

  .howto-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.6);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .howto-card{
    position: relative;
    background: var(--bg-panel); border-radius: 18px; padding: 26px 24px;
    max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .howto-card h2{ font-family:'Fraunces',serif; margin-top:0; }
  .howto-card ul{ line-height:1.7; }
  .howto-close{
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(245,239,224,0.1); color: var(--ink);
    font-size: 1.1rem; line-height: 1; cursor: pointer;
    display: flex; align-items:center; justify-content:center;
  }
  .howto-close:hover{ background: rgba(245,239,224,0.2); }
  .howto-example-word{
    font-family:'Fraunces',serif; background: var(--rung); color:#1B2A41;
    padding: 2px 8px; border-radius:6px; font-weight:600; text-transform: uppercase;
    display: inline-block; margin: 3px 0; line-height: 1.4;
  }

  .timer-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.6);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .timer-card{
    background: var(--bg-panel); border-radius: 18px; padding: 26px 24px;
    max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .timer-card h2{ font-family:'Fraunces',serif; margin-top:0; margin-bottom: 10px; }
  .timer-card p{ color: var(--ink-dim); font-size: 0.9rem; margin-bottom: 20px; }
  .timer-choice-actions{ display:flex; gap:10px; }
  .timer-choice-actions button{
    flex:1; border:none; border-radius:10px; padding:12px 10px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:0.9rem;
    background: rgba(245,239,224,0.1); color: var(--ink);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .timer-choice-actions button:hover{ background: var(--amber); color: #1B2A41; }

  .timer-widget{
    position: absolute; top: 0; right: 0;
    display: flex; align-items:center; gap: 8px;
  }
  .timer-display{
    font-family:'Fraunces',serif; font-weight:700; font-variant-numeric: tabular-nums;
    color: var(--amber); font-size: 0.95rem; min-width: 3.2em;
  }
  .timer-toggle{
    background: none; border: none; color: var(--ink-dim); text-decoration: underline dotted;
    font-family:'Inter',sans-serif; font-size: 0.72rem; cursor: pointer; padding: 4px 0;
  }
  .timer-toggle:hover{ color: var(--amber); }

  footer{ text-align:center; margin-top: 8px; color: var(--ink-dim); font-size: 0.7rem; flex-shrink:0; }

  @media (max-width: 420px){
    .rung{ min-width: calc(var(--rung-minw, 140px) * 0.8); }
    .brand{ font-size: 1.7rem; }
    .timer-widget{ flex-direction: column; align-items: flex-end; gap: 2px; }
    .timer-display{ font-size: 0.85rem; min-width: 0; }
    .timer-toggle{ font-size: 0.65rem; }
  }

  .confetti-piece{
    position: fixed;
    top: -12px;
    width: 8px;
    height: 14px;
    opacity: 0.95;
    pointer-events: none;
    z-index: 999;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity: 0.4; }
  }

  .migration-banner{
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--amber);
    color: #1B2A41;
    font-weight: 600;
    font-size: 0.9rem;
    text-align: center;
    padding: 10px 40px 10px 14px;
    z-index: 1001;
  }
  .migration-banner a{ color: #1B2A41; text-decoration: underline; }
  .migration-banner-persistent .migration-dismiss{
    position: absolute;
    right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none;
    font-size: 1.3rem; line-height: 1;
    color: #1B2A41; cursor: pointer;
    padding: 4px;
  }

  .summit-banner{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-panel);
    color: var(--amber);
    padding: 22px 28px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.15rem;
    z-index: 1000;
    max-width: 320px;
    animation: summit-pop 0.3s ease;
  }
  @keyframes summit-pop{
    from{ transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
    to{ transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  .ladder-climb-overlay{ position: fixed; inset: 0; pointer-events: none; z-index: 999; }
  .anchor-letter{ transition: opacity 0.2s ease; }
  .climb-ladder{
    position: fixed;
    right: 6vw;
    width: 46px;
    pointer-events: none;
    z-index: 999;
    background:
      linear-gradient(var(--rung), var(--rung)) left / 5px 100% no-repeat,
      linear-gradient(var(--rung), var(--rung)) right / 5px 100% no-repeat,
      repeating-linear-gradient(to bottom, transparent 0, transparent 26px, var(--rung) 26px, var(--rung) 32px);
    animation: ladder-appear 0.3s ease;
  }
  @keyframes ladder-appear{
    from{ opacity: 0; transform: translateX(20px); }
    to{ opacity: 1; transform: translateX(0); }
  }
  .climb-letter{
    position: fixed;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--ink);
    width: 30px; height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 1000;
    left: var(--start-x);
    top: var(--start-y);
    animation: letter-walk-climb 3.06s linear forwards;
  }
  @keyframes letter-walk-climb{
    0%{ left: var(--start-x); top: var(--start-y); transform: translateY(0); opacity: 1; }
    6%{ top: var(--start-y); transform: translateY(-11px); opacity: 1; }
    12%{ left: calc(var(--start-x) + (var(--ladder-x) - var(--start-x)) * 0.22); top: var(--start-y); transform: translateY(0); opacity: 1; }
    18%{ top: var(--start-y); transform: translateY(-11px); opacity: 1; }
    24%{ left: calc(var(--start-x) + (var(--ladder-x) - var(--start-x)) * 0.44); top: var(--start-y); transform: translateY(0); opacity: 1; }
    30%{ top: var(--start-y); transform: translateY(-11px); opacity: 1; }
    36%{ left: calc(var(--start-x) + (var(--ladder-x) - var(--start-x)) * 0.66); top: var(--start-y); transform: translateY(0); opacity: 1; }
    42%{ top: var(--start-y); transform: translateY(-11px); opacity: 1; }
    48%{ left: var(--ladder-x); top: var(--start-y); transform: translateY(0); opacity: 1; }
    55%{ top: calc(var(--start-y) + (-60px - var(--start-y)) * 0.2); transform: translateY(-9px); opacity: 1; }
    62%{ top: calc(var(--start-y) + (-60px - var(--start-y)) * 0.2); transform: translateY(0); opacity: 1; }
    69%{ top: calc(var(--start-y) + (-60px - var(--start-y)) * 0.45); transform: translateY(-9px); opacity: 1; }
    76%{ top: calc(var(--start-y) + (-60px - var(--start-y)) * 0.45); transform: translateY(0); opacity: 1; }
    83%{ top: calc(var(--start-y) + (-60px - var(--start-y)) * 0.7); transform: translateY(-9px); opacity: 1; }
    90%{ top: calc(var(--start-y) + (-60px - var(--start-y)) * 0.7); transform: translateY(0); opacity: 1; }
    100%{ left: var(--ladder-x); top: -60px; opacity: 0; transform: translateY(0); }
  }
</style>
</head>

<div class="wrap">
  <header>
    <h1 class="brand">Letter Ladder</h1>
    <div class="timer-widget" id="timer-widget"></div>
    <div class="top-links">
      <a href="about.html">How to play</a>
      <a href="#" id="solution-link">View solution</a>
      <a href="stats.html">Your stats</a>
      <a href="past-puzzles.html">Past puzzles</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.instagram.com/letterladder" target="_blank" rel="noopener" class="logo-link" aria-label="Follow Letter Ladder on Instagram">
        <svg width="22" height="22" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <defs>

<script>
// ---------- date helpers ----------
function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function prettyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
function resolveDateKey(){
  // Supports "Past Puzzles" archive play via ?archive=YYYY-MM-DD. Only
  // ever accepts a date that's both a real scheduled puzzle AND strictly
  // before today - never today's own date (that's just the real game) and
  // never a future date (which would leak an upcoming puzzle early).
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('archive');
  const today = todayKey();
  if(requested && /^\d{4}-\d{2}-\d{2}$/.test(requested) && requested < today
     && PUZZLE_SCHEDULE && PUZZLE_SCHEDULE[requested]){
    return { key: requested, isArchive: true };
  }
  return { key: today, isArchive: false };
}

// ---------- game logic (ported from the original Flask app.py) ----------
function counter(str){
  const c = {};
  for(const ch of str) c[ch] = (c[ch]||0)+1;
  return c;
}
function timesText(n){
  if(n === 1) return 'once';
  if(n === 2) return 'twice';
  return `${n} times`;
}
// Tapping a button while a box is focused would otherwise blur that
// input first, which triggers commit() and can close/reset the box
// before this button's own action gets a chance to run. The fix is to
// run the action directly inside touchend (with preventDefault to stop
// the blur), not in a separate click listener - preventDefault on a
// touch event can silently suppress the click that would otherwise
// follow it, which is what broke this whole class of button on mobile.
function bindTapAction(el, action){
  let firedViaTouch = false;
  el.addEventListener('touchend', (e)=>{
    e.preventDefault();
    firedViaTouch = true;
    action();
  });
  el.addEventListener('mousedown', (e)=> e.preventDefault());
  el.addEventListener('click', ()=>{
    if(firedViaTouch){ firedViaTouch = false; return; }
    action();
  });
}

function joinAnd(items){
  if(items.length === 1) return items[0];
  if(items.length === 2) return `${items[0]} and ${items[1]}`;
  return `${items.slice(0,-1).join(', ')}, and ${items[items.length-1]}`;
}
function lettersPhrase(letters){
  return letters.length === 1 ? `the letter ${letters[0]}` : `the letters ${joinAnd(letters)}`;
}
function getHintLetterOrder(word){
  // The hint just needs to show which letters are used, not imply any
  // particular order matters - so if the plain alphabetical arrangement
  // happens to spell out a real word (possibly even the answer itself),
  // shuffle instead rather than accidentally giving away more than
  // intended.
  const lower = word.toLowerCase();
  const sorted = lower.split('');
  sorted.sort();
  if(!WORD_SET.has(sorted.join(''))){
    return sorted;
  }
  let attempt = sorted.slice();
  for(let i = 0; i < 20; i++){
    for(let j = attempt.length - 1; j > 0; j--){
      const k = Math.floor(Math.random() * (j + 1));
      [attempt[j], attempt[k]] = [attempt[k], attempt[j]];
    }
    if(!WORD_SET.has(attempt.join(''))) return attempt;
  }
  // Vanishingly unlikely to ever be reached, but don't loop forever.
  return attempt;
}
function checkGuessLetters(guess, startingWord, finalWord){
  const problems = [];

  const guessCounter = counter(guess);
  const startingCounter = counter(startingWord);
  const missingStarting = [];
  for(const ch of Object.keys(startingCounter)){
    const have = guessCounter[ch] || 0;
    if(have < startingCounter[ch]) missingStarting.push(ch);
  }
  if(missingStarting.length > 0){
    problems.push({ reason:'missing_starting_letters', letters: missingStarting });
  }

  const finalCounter = counter(finalWord);
  const notInFinal = [];
  const tooMany = [];
  for(const ch of Object.keys(guessCounter)){
    const gCount = guessCounter[ch];
    const fCount = finalCounter[ch] || 0;
    if(fCount === 0){
      notInFinal.push(ch);
    } else if(gCount > fCount){
      tooMany.push({ ch, fCount });
    }
  }
  if(notInFinal.length > 0){
    problems.push({ reason:'letter_not_in_final', letters: notInFinal });
  }
  if(tooMany.length > 0){
    problems.push({ reason:'too_many_repeats', details: tooMany });
  }
  return problems;
}
function isStepValid(word1, word2){
  if(word2.length !== word1.length + 1){
    return { valid:false, reason:'wrong_length' };
  }
  const counts1 = counter(word1);
  const counts2 = counter(word2);
  const missing = [];
  for(const ch of Object.keys(counts1)){
    const have = counts2[ch] || 0;
    if(have < counts1[ch]) missing.push(ch);
  }
  if(missing.length > 0){
    return { valid:false, reason:'missing_letters', letters: missing };
  }
  return { valid:true };
}
function isValidChain(startingWord, guessesObj, finalWord){
  const lengths = Object.keys(guessesObj).map(Number).sort((a,b)=>a-b);
  const allWords = [startingWord, ...lengths.map(l => guessesObj[l]), finalWord];
  const invalidSteps = [];
  for(let i=0;i<allWords.length-1;i++){
    const result = isStepValid(allWords[i], allWords[i+1]);
    if(!result.valid){
      invalidSteps.push({ from: allWords[i], to: allWords[i+1], ...result });
    }
  }
  return { valid: invalidSteps.length === 0, invalidSteps };
}

const TIERS = ['easy','medium','hard'];
// Must match START_DATE in scripts/generate_schedule.py, so the puzzle

const OLD_DOMAIN_HOSTNAME = 'jmaser54.github.io';
const OLD_DOMAIN_PATH_PREFIX = '/letter-ladder/';
const NEW_DOMAIN_HOSTNAME = 'letterladder.io';

function collectMigratableData(){
  const data = {};
  const globalKeys = [
    'letterladder:stats',
    'letterladder:activeTier',
    'letterladder:howToPlaySeen',
    'letterladder:keyboardEnabled',
    'letterladder:timerChoice',
    'letterladder:timerChoiceMade',
  ];
  for(const key of globalKeys){
    const value = localStorage.getItem(key);
    if(value !== null) data[key] = value;
  }
  // Also grab everything scoped to today's date (in-progress gameplay:
  // guesses, hints used, timer state, played/solved/loss bookkeeping
  // flags) - past days' per-puzzle data isn't included since it's no
  // longer actionable anyway (an old puzzle can't be replayed), and the
  // aggregate stats object above already captures what matters from
  // history (streaks, totals, scores).
  const todayPrefix = `letterladder:${todayKey()}:`;
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(todayPrefix)){
      data[key] = localStorage.getItem(key);
    }
  }
  return data;
}

function importMigrationDataIfPresent(){
  if(window.location.hostname !== NEW_DOMAIN_HOSTNAME) return;
  const params = new URLSearchParams(window.location.search);
  const migrateParam = params.get('migrate');
  if(!migrateParam) return;

  try{
    const data = JSON.parse(decodeURIComponent(migrateParam));
    let importedCount = 0;
    for(const [key, value] of Object.entries(data)){
      // Only fill in keys that aren't already present locally, so this
      // never overwrites any fresh progress already made on the new
      // domain before clicking the migration link.
      if(localStorage.getItem(key) === null){
        localStorage.setItem(key, value);
        importedCount++;
      }
    }
    if(importedCount > 0){
      window.letterLadderMigrationJustImported = true;
    }
  }catch(e){
    // malformed or tampered migrate param - fail silently rather than
    // breaking the page load over it
  }

  // Clean the URL either way, so the migration data doesn't linger in
  // the address bar or browser history.
  const cleanUrl = window.location.origin + window.location.pathname;
  window.history.replaceState({}, '', cleanUrl);
}

function showMigrationWelcomeBannerIfNeeded(){
  if(!window.letterLadderMigrationJustImported) return;
  const banner = document.createElement('div');
  banner.className = 'migration-banner';

  document.body.appendChild(banner);

}

function showMigrationLinkBannerIfNeeded(){

  if(window.location.pathname !== OLD_DOMAIN_PATH_PREFIX) return;
  if(localStorage.getItem('letterladder:migrationBannerDismissed')) return;
  const data = collectMigratableData();
  if(Object.keys(data).length === 0) return; // nothing meaningful to offer migrating

  const encoded = encodeURIComponent(JSON.stringify(data));
  const migrationUrl = `https://${NEW_DOMAIN_HOSTNAME}/?migrate=${encoded}`;

  const banner = document.createElement('div');
  banner.className = 'migration-banner migration-banner-persistent';
  banner.innerHTML = `
    <span>We've moved! <a href="${migrationUrl}">Play at letterladder.io</a> to keep your streak and stats.</span>
    <button type="button" class="migration-dismiss" aria-label="Dismiss">&times;</button>
  `;
  document.body.appendChild(banner);
  banner.querySelector('.migration-dismiss').addEventListener('click', () => {

}

const { key: dateKey, isArchive: isArchiveMode } = resolveDateKey();

// ---------- optional per-puzzle timer ----------
const TIMER_CHOICE_KEY = 'letterladder:timerChoice';
function getTimerChoice(){ return localStorage.getItem(TIMER_CHOICE_KEY) || 'untimed'; }
function setTimerChoice(choice){ localStorage.setItem(TIMER_CHOICE_KEY, choice); }
function timerStartKey(tier){ return `letterladder:${dateKey}:${tier}:timerStartedAt`; }
function timerElapsedKey(tier){ return `letterladder:${dateKey}:${tier}:timerElapsedMs`; }
function formatElapsed(ms){
  const totalSeconds = Math.floor(ms / 1000);
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function startTimerIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never get timed
  if(!(PUZZLE_SCHEDULE[dateKey] && PUZZLE_SCHEDULE[dateKey][tier])) return; // nothing scheduled to time
  if(localStorage.getItem(timerElapsedKey(tier))) return; // already solved and frozen
  if(localStorage.getItem(timerStartKey(tier))) return; // already started
  localStorage.setItem(timerStartKey(tier), String(Date.now()));
}
let timerTickInterval = null;

function renderTimerWidget(){
  const widget = document.getElementById('timer-widget');
  if(!widget) return;

  if(isArchiveMode){
    widget.innerHTML = '';
    return;
  }

  const choice = getTimerChoice();
  let timeHtml = '';
  if(choice === 'timed'){
    const frozenElapsed = localStorage.getItem(timerElapsedKey(activeTier));
    const startedAt = localStorage.getItem(timerStartKey(activeTier));
    let elapsedMs;
    if(frozenElapsed !== null){
      elapsedMs = Number(frozenElapsed);
    } else if(startedAt !== null){
      elapsedMs = Date.now() - Number(startedAt);
    } else {
      elapsedMs = 0;
    }
    timeHtml = `<span class="timer-display">${formatElapsed(elapsedMs)}</span>`;
  }

  widget.innerHTML = `${timeHtml}<button type="button" class="timer-toggle">${choice === 'timed' ? 'Turn off timer' : 'Turn on timer'}</button>`;

// ---------- stats, streaks & score (all local to this device/browser -
// there are no accounts, so none of this follows you to another device) ----------
const STATS_KEY = 'letterladder:stats';
const HINT_PENALTY_PER_USE = 5; // tweak this to make hints cost more/less

function blankStat(){
  return { played:0, solved:0, currentStreak:0, maxStreak:0, lastSolvedDate:null, score:0 };
}
function loadStats(){
  try{
    const raw = localStorage.getItem(STATS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // guard against a corrupted/partial object from an older version
      for(const key of ['easy','medium','hard','total']){
        parsed[key] = Object.assign(blankStat(), parsed[key] || {});
      }
      return parsed;
    }
  }catch(e){}
  return { easy: blankStat(), medium: blankStat(), hard: blankStat(), total: blankStat() };
}
function saveStats(stats){
  try{ localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }catch(e){}
}
function dateKeyMinusOneDay(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()-1);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function bumpStreak(stat, todayKeyStr){
  if(stat.lastSolvedDate === todayKeyStr) return; // already counted today, don't double-bump
  const wasYesterday = stat.lastSolvedDate === dateKeyMinusOneDay(todayKeyStr);
  stat.currentStreak = wasYesterday ? stat.currentStreak + 1 : 1;
  stat.maxStreak = Math.max(stat.maxStreak, stat.currentStreak);
  stat.lastSolvedDate = todayKeyStr;
}

function revealSolutionAsLoss(tier){
  const puzzleHints = HINTS_SCHEDULE[dateKey] && HINTS_SCHEDULE[dateKey][tier];
  if(!puzzleHints) return; // nothing to reveal - shouldn't happen in practice
  const solution = puzzleHints.solution;
  const revealedGuesses = {};
  for(let i = 1; i < solution.length - 1; i++){
    revealedGuesses[solution[i].length] = solution[i];
  }
  saveGuesses(tier, revealedGuesses);
  localStorage.setItem(`letterladder:${dateKey}:${tier}:solutionRevealedAsLoss`, '1');
  recordLossIfNeeded(tier);
}

function recordLossIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${dateKey}:${tier}:lossCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');

  markPlayedIfNeeded(tier);

  const stats = loadStats();
  stats[tier].currentStreak = 0; // explicitly break the streak - this is a loss
  saveStats(stats);
}

function markPlayedIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${dateKey}:${tier}:playedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');
  const stats = loadStats();
  stats[tier].played += 1;
  stats.total.played += 1;
  saveStats(stats);
}

function recordHintUsed(tier){

function getHintsUsed(tier){

}

function getHintInfo(tier, L){

function getLastHintedLength(tier){

function markStartedIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${dateKey}:${tier}:startedCounted`;

      tier: tier,

function markSolvedIfNeeded(tier, guesses){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${dateKey}:${tier}:solvedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');

  const startedAt = localStorage.getItem(timerStartKey(tier));
  if(startedAt){
    localStorage.setItem(timerElapsedKey(tier), String(Date.now() - Number(startedAt)));
  }

  // Track puzzle completions in GA4. Guarded since ad blockers commonly
  // block analytics scripts entirely - that should never be able to
  // break the actual game if gtag isn't available for any reason.
  if(typeof gtag === 'function'){
    gtag('event', 'puzzle_completed', {
      tier: tier,
      hints_used: getHintsUsed(tier),
      puzzle_date: dateKey,
    });

    // Track which specific word was used at each rung length, using the
    // final settled answer at the moment of completion rather than every
    // intermediate attempt - this fires exactly once per rung per player
    // (guarded by the same one-time flag as puzzle_completed above), so
    // changing an answer back and forth (e.g. table -> bleat -> table)
    // only ever counts as a single "table" for that position.
    for(const len of Object.keys(guesses)){
      gtag('event', 'word_used', {
        tier: tier,
        puzzle_date: dateKey,
        rung_length: Number(len),
        word: guesses[len],
      });
    }
  }

  const stats = loadStats();
  const stat = stats[tier];
  stat.solved += 1;
  stats.total.solved += 1;
  bumpStreak(stat, dateKey);

  // Score: reward the length of every word the person actually had to
  // guess (the start/final words are given to you, so they don't count),
  // minus a small penalty for each hint used on this specific puzzle.
  const guessedWords = Object.values(guesses);
  const basePoints = guessedWords.reduce((sum, w) => sum + w.length, 0);
  const penalty = getHintsUsed(tier) * HINT_PENALTY_PER_USE;
  stat.score += Math.max(0, basePoints - penalty);
  stats.total.score = stats.easy.score + stats.medium.score + stats.hard.score;

  // If this solve completes all three tiers for today, the "total" streak
  // (a separate concept from the per-tier ones - it tracks consecutive
  // days you completed EVERY puzzle, tying into the summit celebration)
  // gets its own bump.
  if(TIERS.every(isTierComplete)){
    bumpStreak(stats.total, dateKey);
  }

  saveStats(stats);

  // Confetti for the 1st and 2nd puzzle completed today, whichever tiers
  // those happen to be - the 3rd (finishing all three) gets the bigger
  // ladder-climb celebration instead, not confetti.
  if(!TIERS.every(isTierComplete)){
    triggerTierWinConfetti();
  }
}

function computeInitialUsedIndices(order, typedValue){
  // Best-effort reconstruction for a slot that already has a value when
  // opened (we don't know which specific tiles were originally tapped,
  // so this just claims the first N matching instances of each letter).
  const neededCounts = {};
  for(const ch of typedValue.toUpperCase()){
    neededCounts[ch] = (neededCounts[ch] || 0) + 1;
  }
  const consumedSoFar = {};
  const indices = [];
  order.forEach((letter, i) => {
    const upper = letter.toUpperCase();
    consumedSoFar[upper] = consumedSoFar[upper] || 0;
    if(neededCounts[upper] && consumedSoFar[upper] < neededCounts[upper]){
      indices.push(i);
      consumedSoFar[upper]++;
    }
  });
  return indices;
}

function setupBankTileDragging(){
  const bankTiles = document.getElementById('bank-tiles');
  if(!bankTiles) return;
  const HOLD_DELAY_MS = 300; // long enough to not trigger on a normal tap, short enough to feel responsive
  const MOVE_CANCEL_THRESHOLD = 10; // px of movement before the hold timer fires that cancels the drag-intent (lets a quick swipe/scroll pass through untouched)

  bankTiles.querySelectorAll('.bank-tile').forEach(tile => {
    tile.addEventListener('pointerdown', (e)=>{
      if(tile.disabled) return;
      if(!bankState[activeTier]) return;

      const startClientX = e.clientX;
      const startClientY = e.clientY;
      const rect = tile.getBoundingClientRect();
      const grabOffsetX = e.clientX - rect.left;
      const grabOffsetY = e.clientY - rect.top;
      let dragging = false;
      let holdTimeout = null;

      function beginDrag(){
        dragging = true;
        skipNextBankTap = true;
        tile.classList.add('dragging');
        tile.style.position = 'fixed';
        tile.style.left = `${rect.left}px`;
        tile.style.top = `${rect.top}px`;
        tile.style.width = `${rect.width}px`;
        tile.style.height = `${rect.height}px`;
        tile.style.margin = '0';
      }

      function onMove(ev){
        if(!dragging){
          const dx = Math.abs(ev.clientX - startClientX);
          const dy = Math.abs(ev.clientY - startClientY);
          if(dx > MOVE_CANCEL_THRESHOLD || dy > MOVE_CANCEL_THRESHOLD){
            clearTimeout(holdTimeout);
          }
          return;
        }
        ev.preventDefault();
        tile.style.left = `${ev.clientX - grabOffsetX}px`;
        tile.style.top = `${ev.clientY - grabOffsetY}px`;

        // Figure out whether the pointer has moved over a different,
        // still-available tile - if so, that tile takes the dragged
        // one's old spot and everything between shifts accordingly.
        const others = [...bankTiles.querySelectorAll('.bank-tile')].filter(t => t !== tile && !t.disabled);
        for(const other of others){
          const oRect = other.getBoundingClientRect();
          if(ev.clientX < oRect.left || ev.clientX > oRect.right || ev.clientY < oRect.top || ev.clientY > oRect.bottom) continue;
          const draggedIndex = Number(tile.dataset.index);
          const targetIndex = Number(other.dataset.index);
          if(draggedIndex === targetIndex) continue;

          const order = bankState[activeTier].order;
          const stableIds = bankState[activeTier].stableIds;
          const [moved] = order.splice(draggedIndex, 1);
          order.splice(targetIndex, 0, moved);
          const [movedId] = stableIds.splice(draggedIndex, 1);
          stableIds.splice(targetIndex, 0, movedId);

          // Relocate the actual DOM node rather than rebuilding the
          // list, so the drag gesture (and this tile's identity/
          // listeners) is never interrupted mid-motion.
          if(draggedIndex < targetIndex){ other.after(tile); } else { other.before(tile); }
          [...bankTiles.querySelectorAll('.bank-tile')].forEach((el, i) => { el.dataset.index = String(i); });
          break;
        }
      }

      function onUp(){
        clearTimeout(holdTimeout);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        if(dragging){
          tile.classList.remove('dragging');
          tile.style.position = '';
          tile.style.left = '';
          tile.style.top = '';
          tile.style.width = '';
          tile.style.height = '';
          tile.style.margin = '';
        }
      }

      holdTimeout = setTimeout(beginDrag, HOLD_DELAY_MS);
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}


function getBankWord(finalWord, guesses, steps, activeLength){
  // The bank shows whichever already-filled slot is the nearest one above
  // the active length - since every valid lower word's letters must be a
  // subset of every valid higher word's letters, that's always a valid
  // reference for building the current slot. Falls back to the final word
  // (the given, longest reference) if nothing above the active slot is
  // filled in yet.
  const above = steps.filter(L => L > activeLength && guesses[L]).sort((a,b)=>a-b);
  if(above.length > 0) return guesses[above[0]];
  return finalWord;
}

function getBelowWord(startingWord, guesses, steps, activeLength){
  // Mirror of getBankWord, looking downward instead of up: the letters in
  // whichever filled slot is the nearest one below the active length are
  // guaranteed to all reappear in the current guess too, so highlighting
  // them helps show what's already "locked in" versus what's genuinely
  // new territory. Falls back to the puzzle's given starting word if
  // nothing below the active slot has been filled in yet.
  const below = steps.filter(L => L < activeLength && guesses[L]).sort((a,b)=>b-a);
  if(below.length > 0) return guesses[below[0]];
  return startingWord;
}

function computeBelowMatchIndices(order, belowWord){
  // Greedily matches bank tiles (in whatever order they're currently
  // shown, shuffled or not) against the letter counts in belowWord, so
  // exactly the right number of tiles per letter get marked - e.g. if
  // belowWord has one "e" but the bank has two "e" tiles, only one of
  // them is marked as "from below," never both or neither.
  const remaining = {};
  for(const ch of belowWord){ remaining[ch] = (remaining[ch] || 0) + 1; }
  const matched = new Set();
  order.forEach((letter, i) => {
    if(remaining[letter] > 0){
      matched.add(i);
      remaining[letter]--;
    }
  });
  return matched;
}

function isTierComplete(tier){
  const puzzle = getTodaysPuzzle(tier);
  if(!puzzle) return true; // no puzzle scheduled for this tier today - don't block the celebration on it
  const steps = [];
  for(let L = puzzle.start.length+1; L < puzzle.final.length; L++) steps.push(L);
  const guesses = loadGuesses(tier);
  if(!steps.every(L => guesses[L])) return false;
  const { valid } = isValidChain(puzzle.start, guesses, puzzle.final);
  return valid;
}

function puzzleDayNumber(){
  const [ly, lm, ld] = LAUNCH_DATE_KEY.split('-').map(Number);
  const launch = new Date(ly, lm-1, ld);
  const [ty, tm, td] = dateKey.split('-').map(Number);
  const today = new Date(ty, tm-1, td);
  const diffDays = Math.round((today - launch) / 86400000);
  return diffDays + 1;
}

function buildShareText(){
  const tierLabels = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const lines = [];
  const timerChoice = getTimerChoice();
  for(const tier of TIERS){
    const puzzle = getTodaysPuzzle(tier);
    if(!puzzle) continue; // nothing scheduled for this tier today, skip it
    if(isTierComplete(tier)){
      const hints = getHintsUsed(tier);
      let timeSuffix = null;
      if(timerChoice === 'timed'){
        const frozenElapsed = localStorage.getItem(timerElapsedKey(tier));
        if(frozenElapsed !== null){
          const totalSeconds = Number(frozenElapsed) / 1000;
          timeSuffix = totalSeconds < 60
            ? `${totalSeconds.toFixed(1)}s`
            : `${Math.floor(totalSeconds / 60)}m ${Math.round(totalSeconds % 60)}s`;
        }
      }
      let line;
      if(timeSuffix !== null){
        // The time itself already proves completion, so the checkmark
        // (and parentheses around the time) would just be redundant -
        // hints still get shown alongside it though, since that's
        // distinct, meaningful info about how much help was needed.
        line = hints > 0
          ? `${tierLabels[tier]}: ${timeSuffix} ${'💡'.repeat(hints)}`
          : `${tierLabels[tier]}: ${timeSuffix}`;
      } else {
        line = hints > 0
          ? `${tierLabels[tier]}: ${'💡'.repeat(hints)}`
          : `${tierLabels[tier]}: ✔️`;
      }
      lines.push(line);
    } else {
      lines.push(`${tierLabels[tier]}: —`);
    }
  }
  return `Letter Ladder #${puzzleDayNumber()} 🪜\n\n${lines.join('\n')}\n\n${SITE_URL}`;
}

async function buildShareImage(){
  // Builds a results-card PNG matching the game's own visual style, for
  // sharing to platforms like Instagram Stories that handle images far
  // better than plain text through the native share sheet.
  const tierLabels = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const rows = [];
  for(const tier of TIERS){
    const puzzle = getTodaysPuzzle(tier);
    if(!puzzle) continue;
    if(isTierComplete(tier)){
      const hints = getHintsUsed(tier);
      rows.push({ label: tierLabels[tier], status: hints > 0 ? '💡'.repeat(hints) : '✔', solved: true });
    } else {
      rows.push({ label: tierLabels[tier], status: '—', solved: false });
    }
  }

  const W = 1080, H = 1080;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background gradient matching the game's own body background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#24384F');
  grad.addColorStop(0.55, '#1B2A41');
  grad.addColorStop(1, '#142132');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = '#F5EFE0';
  ctx.font = "700 68px Georgia, serif";
  ctx.fillText(`Letter Ladder #${puzzleDayNumber()} 🪜`, W/2, 170);

  ctx.fillStyle = '#9FB3C8';
  ctx.font = "400 38px Arial, sans-serif";
  ctx.fillText("Can you climb it?", W/2, 232);

  // Per-tier result rows, styled as bold, high-contrast cards - solid
  // amber fill for solved tiers (not a faint tint), a clearly visible
  // outlined box for unsolved ones, so this still reads clearly even at
  // the small thumbnail size most share sheets and chat apps show it at.
  let y = 330;
  const cardW = 820, cardH = 140, cardX = (W - cardW) / 2, cardGap = 26;
  for(const row of rows){
    ctx.beginPath();
    ctx.roundRect(cardX, y, cardW, cardH, 24);
    if(row.solved){
      ctx.fillStyle = '#E8A33D';
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    const textColor = row.solved ? '#1B2A41' : '#F5EFE0';
    ctx.textAlign = 'left';
    ctx.fillStyle = textColor;
    ctx.font = "700 52px Arial, sans-serif";
    ctx.fillText(row.label, cardX + 40, y + 90);

    ctx.textAlign = 'right';
    ctx.font = "700 52px Arial, sans-serif";
    ctx.fillStyle = row.solved ? textColor : '#9FB3C8';
    ctx.fillText(row.status, cardX + cardW - 40, y + 90);

    y += cardH + cardGap;
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9FB3C8';
  ctx.font = "400 34px Arial, sans-serif";
  ctx.fillText(SITE_URL.replace('https://', ''), W/2, y + 30);

  return new Promise(resolve => {
    canvas.toBlob(blob => resolve(blob), 'image/png');
  });
}
